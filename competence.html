  <style>
    .comp-detail-hero {
      padding: 5rem 2rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .comp-code-badge {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--accent-light);
      border: 1px solid rgba(61,92,65,.25);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: .82rem;
      font-weight: 700;
      padding: .35em .9em;
      border-radius: 6px;
      letter-spacing: .06em;
      margin-bottom: 1.2rem;
    }
    .comp-code-badge::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }

    .comp-detail-hero h1 {
      font-family: var(--font-head);
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: .8rem;
    }
    .comp-detail-hero .comp-domaine {
      font-size: .85rem;
      color: var(--text-muted);
      letter-spacing: .05em;
    }
    .comp-detail-hero .comp-domaine span {
      color: var(--accent);
      font-weight: 600;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 2rem;
    }
    .breadcrumb a { color: var(--text-muted); }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb-sep { opacity: .4; }

    /* Info banner */
    .info-banner {
      background: var(--accent-light);
      border: 1px solid rgba(61,92,65,.2);
      border-radius: var(--radius-lg);
      padding: 1.2rem 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 2.5rem;
    }
    .info-banner svg {
      width: 20px; height: 20px;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .info-banner p { font-size: .86rem; color: var(--text-sub); line-height: 1.65; }
    .info-banner strong { color: var(--accent); }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--text-sub);
      transition: all .2s;
      margin-bottom: 2rem;
    }
    .back-btn:hover {
      background: var(--accent-light);
      border-color: rgba(61,92,65,.3);
      color: var(--accent);
    }
    .back-btn svg { width: 14px; height: 14px; }

    /* ══ CARTE RÉALISATION ══ */
    .real-proof-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color .25s, box-shadow .25s, transform .2s;
    }
    .real-proof-card:hover {
      border-color: rgba(61,92,65,.3);
      box-shadow: var(--shadow-accent);
      transform: translateY(-2px);
    }

    /* En-tête de carte */
    .real-proof-header {
      display: flex;
      align-items: center;
      gap: .9rem;
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }
    .real-proof-num {
      min-width: 30px; height: 30px;
      border-radius: 7px;
      background: var(--accent-light);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: .75rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .real-proof-header-title {
      font-family: var(--font-head);
      font-size: .95rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
    }
    .real-proof-pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .35rem .85rem;
      background: var(--accent-light);
      border: 1px solid rgba(61,92,65,.25);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      transition: background .18s, color .18s;
      flex-shrink: 0;
    }
    .real-proof-pdf-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .real-proof-pdf-btn svg { width: 11px; height: 11px; }

    /* Corps : layout 2 colonnes */
    .real-proof-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 680px) {
      .real-proof-body { grid-template-columns: 1fr; }
    }

    /* Colonne gauche : justification */
    .real-proof-justify {
      padding: 1.5rem 1.6rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (max-width: 680px) {
      .real-proof-justify { border-right: none; border-bottom: 1px solid var(--border); }
    }

    .justify-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .justify-label::before {
      content: '';
      width: 14px; height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }

    .justify-text {
      font-size: .86rem;
      color: var(--text-sub);
      line-height: 1.75;
    }

    .justify-points {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      margin-top: .2rem;
    }
    .justify-point {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      font-size: .84rem;
      color: var(--text-sub);
      line-height: 1.55;
    }
    .justify-point::before {
      content: '▸';
      color: var(--accent);
      font-size: .75rem;
      margin-top: .15rem;
      flex-shrink: 0;
    }

    /* Colonne droite : image */
    .real-proof-image {
      padding: 1.5rem 1.6rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .proof-img-wrap {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg3);
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .proof-img-wrap:hover {
      box-shadow: 0 6px 24px rgba(61,92,65,.18);
      transform: scale(1.01);
    }
    .proof-img-wrap img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top;
      display: block;
    }
    .proof-img-wrap .img-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(31,42,31,.7) 0%, transparent 100%);
      padding: .6rem .8rem;
      font-size: .7rem;
      color: rgba(255,255,255,.85);
      font-family: var(--font-mono);
      opacity: 0;
      transition: opacity .2s;
    }
    .proof-img-wrap:hover .img-overlay { opacity: 1; }

    /* Placeholder quand pas d'image */
    .proof-img-placeholder {
      width: 100%;
      height: 160px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      color: var(--text-muted);
      font-size: .8rem;
      font-family: var(--font-mono);
    }
    .proof-img-placeholder svg { width: 28px; height: 28px; opacity: .3; }

    .proof-img-caption {
      font-size: .72rem;
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
      line-height: 1.4;
    }

    /* Multi-image layout */
    .real-proof-image--multi {
      overflow-y: auto;
      max-height: 560px;
      align-items: stretch !important;
      justify-content: flex-start !important;
    }
    .proof-multi-img-block {
      width: 100%;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: .2rem;
    }
    .proof-multi-img-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .proof-img-explication {
      font-size: .8rem;
      color: var(--text-sub);
      line-height: 1.65;
      margin-top: .5rem;
      background: var(--bg3);
      border-left: 3px solid var(--accent);
      padding: .55rem .75rem;
      border-radius: 0 6px 6px 0;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,20,15,.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      backdrop-filter: blur(6px);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      object-fit: contain;
    }
    .lightbox-close {
      position: fixed;
      top: 1.5rem; right: 1.5rem;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.22); }

    /* Not found */
    .not-found-msg {
      text-align: center; padding: 4rem 2rem;
    }
    .not-found-msg h2 {
      font-family: var(--font-head); font-size: 1.5rem;
      color: var(--text); margin-bottom: .8rem;
    }
    .not-found-msg p { color: var(--text-muted); }
    .not-found-msg a {
      display: inline-block; margin-top: 1.5rem;
      padding: .55rem 1.2rem;
      background: var(--accent-light);
      border: 1px solid rgba(61,92,65,.25);
      border-radius: 8px; font-size: .85rem;
      font-family: var(--font-mono); color: var(--accent);
    }

    .comp-list { display: flex; flex-direction: column; gap: 1.2rem; }
  </style>
</head>

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function renderPage() {
  const code = getParam('code');
  const container = document.getElementById('comp-content');

  if (!code || !COMPETENCES[code]) {
    container.innerHTML = `
      <div class="page-body" style="padding-top:5rem">
        <div class="not-found-msg">
          <h2>Compétence introuvable</h2>
          <p>Le code "${code || '?'}" ne correspond à aucune compétence référencée.</p>
          <a href="rectorat.html">← Retour au tableau de synthèse</a>
        </div>
      </div>`;
    return;
  }

  const comp = COMPETENCES[code];
  document.title = `${comp.code} · Nathan Poret`;

  const realisationsHTML = comp.realisations.map(r => {

    const pointsHTML = r.points
      ? r.points.map(p => `<div class="justify-point">${p}</div>`).join('')
      : '';

    const lienHTML = r.lienExterne ? `
      <a href="${r.lienExterne}" target="_blank" rel="noopener" style="
        display:inline-flex;align-items:center;gap:.4rem;margin-top:.3rem;
        font-size:.78rem;font-family:var(--font-mono);color:var(--accent);
        text-decoration:none;border-bottom:1px dashed rgba(61,92,65,.3);
        padding-bottom:1px;width:fit-content;">
        <svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M14 3v2H5v14h14v-9h2v10a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h10zm5-2v6h-2V4.414l-7.293 7.293-1.414-1.414L17.586 3H14V1h6z"/></svg>
        Voir le profil LinkedIn
      </a>` : '';

    /* Cas A : plusieurs images -> un bloc (desc gauche / image droite) par image */
    if (r.images && r.images.length > 0) {
      const blocksHTML = r.images.map((img, i) => `
        <div class="real-proof-body" style="${i > 0 ? 'border-top:1px solid var(--border)' : ''}">
          <div class="real-proof-justify">
            <div class="justify-label">Pourquoi \u00e7a prouve la comp\u00e9tence</div>
            <p class="justify-text">${img.explication}</p>
            ${i === 0 && pointsHTML ? `<div class="justify-points">${pointsHTML}</div>` : ''}
            ${i === 0 ? lienHTML : ''}
          </div>
          <div class="real-proof-image">
            <div class="proof-img-wrap" onclick="openLightbox('${img.src}')">
              <img src="${img.src}" alt="${img.caption}" loading="lazy" />
              <div class="img-overlay">\ud83d\udd0d Cliquer pour agrandir</div>
            </div>
            <p class="proof-img-caption">${img.caption}</p>
          </div>
        </div>`).join('');
      return `
      <div class="real-proof-card reveal">
        <div class="real-proof-header">
          <div class="real-proof-num">${r.num}</div>
          <div class="real-proof-header-title">${r.titre}</div>
        </div>
        ${blocksHTML}
      </div>`;
    }

    /* Cas B : image unique ou placeholder */
    let imgHTML = r.image ? `
      <div class="proof-img-wrap" onclick="openLightbox('${r.image}')">
        <img src="${r.image}" alt="${r.titre}" loading="lazy" />
        <div class="img-overlay">\ud83d\udd0d Cliquer pour agrandir</div>
      </div>
      <p class="proof-img-caption">${r.imageCaption || ''}</p>`
    : `<div class="proof-img-placeholder">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        Ajouter une capture d'\u00e9cran<br/>
        <span style="font-size:.68rem;opacity:.7">(ex: IMG_${r.num}.png)</span>
      </div>`;

    return `
      <div class="real-proof-card reveal">
        <div class="real-proof-header">
          <div class="real-proof-num">${r.num}</div>
          <div class="real-proof-header-title">${r.titre}</div>
        </div>
        <div class="real-proof-body">
          <div class="real-proof-justify">
            <div class="justify-label">Pourquoi \u00e7a prouve la comp\u00e9tence</div>
            <p class="justify-text">${r.justification}</p>
            ${pointsHTML ? `<div class="justify-points">${pointsHTML}</div>` : ''}
            ${lienHTML}
          </div>
          <div class="real-proof-image">
            ${imgHTML}
          </div>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="comp-detail-hero">
      <div class="breadcrumb">
        <a href="rectorat.html">Rectorat</a>
        <span class="breadcrumb-sep">›</span>
        <span>${comp.code}</span>
      </div>
      <div class="comp-code-badge">${comp.code}</div>
      <h1>${comp.titre}</h1>
      <p class="comp-domaine">Compétence : <span>${comp.domaine}</span></p>
    </div>

    <div class="page-body" style="padding-top:0;max-width:960px">

      <div class="info-banner reveal">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <p><strong>Définition :</strong> ${comp.description}</p>
      </div>

      <a class="back-btn reveal" href="rectorat.html">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Retour au tableau de synthèse
      </a>

      <section class="block">
        <h2 class="block-title">Réalisations prouvant cette compétence</h2>
        <div class="comp-list">
          ${realisationsHTML}
        </div>
      </section>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderPage();
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach((el, i) => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(22px)';
      el.style.transition = 'opacity .55s ease, transform .55s ease';
      el.style.transitionDelay = Math.min(i * 0.08, 0.4) + 's';
      setTimeout(() => {
        el.style.opacity = '1';
        el.style.transform = 'none';
      }, 60);
    });
  }, 30);
});
</script>
<script src="nav.js"></script>
